<div class="page">
  <header class="page__head">
    <div>
      <h1 class="page__title">Clientes</h1>
      <p class="page__sub">Gestión de usuarios registrados en la plataforma</p>
    </div>
    <span class="page__badge">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
      Usuarios
    </span>
  </header>

  <div class="table-wrap">
    <div class="table" *ngIf="usuarios$ | async as items">
      <div class="table__head">
        <div class="table__cell">ID</div>
        <div class="table__cell">Nombre</div>
        <div class="table__cell">Email</div>
        <div class="table__cell">Teléfono</div>
        <div class="table__cell">Rol</div>
        <div class="table__cell table__cell--right">Acciones</div>
      </div>

      <div class="table__body">
        <div class="table__row" *ngFor="let u of items">
          <ng-container *ngIf="editingId !== u.id_usuario; else editRow">
            <div class="table__cell"><code class="table__code">#{{ u.id_usuario }}</code></div>
            <div class="table__cell table__cell--bold">{{ u.nombre }}</div>
            <div class="table__cell">{{ u.email }}</div>
            <div class="table__cell">{{ u.telefono || '—' }}</div>
            <div class="table__cell">
              <span class="rol-badge" [style.background]="getRolColor(u.rol) + '18'" [style.color]="getRolColor(u.rol)">
                {{ u.rol }}
              </span>
            </div>
            <div class="table__cell table__cell--right">
              <div class="actions">
                <button class="action-btn" (click)="startEdit(u)" title="Editar">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                    <path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4Z"/>
                  </svg>
                </button>
                <button class="action-btn action-btn--danger" (click)="deleteUser(u.id_usuario, u.nombre)" title="Eliminar">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                  </svg>
                </button>
              </div>
            </div>
          </ng-container>

          <ng-template #editRow>
            <div class="table__cell"><code class="table__code">#{{ u.id_usuario }}</code></div>
            <div class="table__cell">
              <input class="inline-input" type="text" [(ngModel)]="editData.nombre">
            </div>
            <div class="table__cell">{{ u.email }}</div>
            <div class="table__cell">
              <input class="inline-input" type="text" [(ngModel)]="editData.telefono" placeholder="—">
            </div>
            <div class="table__cell">
              <select class="inline-select" [(ngModel)]="editData.rol">
                <option value="cliente">cliente</option>
                <option value="taller">taller</option>
                <option value="tecnico">tecnico</option>
                <option value="admin">admin</option>
              </select>
            </div>
            <div class="table__cell table__cell--right">
              <div class="actions">
                <button class="action-btn action-btn--success" (click)="saveEdit(u.id_usuario)" title="Guardar">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"/>
                  </svg>
                </button>
                <button class="action-btn" (click)="cancelEdit()" title="Cancelar">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                  </svg>
                </button>
              </div>
            </div>
          </ng-template>
        </div>

        <div class="table__empty" *ngIf="items.length === 0">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
          </svg>
          <p>No hay usuarios registrados</p>
        </div>
      </div>
    </div>
  </div>
</div>
