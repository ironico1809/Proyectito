<div class="page">
  <header class="page__head">
    <div>
      <h1 class="page__title">Vehículos</h1>
      <p class="page__sub">Listado de vehículos registrados en la plataforma</p>
    </div>
    <button class="page__btn" *ngIf="session.session$ | async as s" (click)="openForm(s.userId)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      Nuevo vehículo
    </button>
  </header>

  <!-- Modal crear -->
  <div class="modal-overlay" *ngIf="showForm" (click)="closeForm()">
    <div class="modal" (click)="$event.stopPropagation()">
      <div class="modal__head">
        <h3>Registrar vehículo</h3>
        <button class="modal__close" (click)="closeForm()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="modal__body">
        <div class="field">
          <label class="field__label">Placa *</label>
          <input class="field__input" type="text" [(ngModel)]="formData.placa" placeholder="ABC1234">
        </div>
        <div class="form-row">
          <div class="field">
            <label class="field__label">Marca</label>
            <input class="field__input" type="text" [(ngModel)]="formData.marca" placeholder="Toyota">
          </div>
          <div class="field">
            <label class="field__label">Modelo</label>
            <input class="field__input" type="text" [(ngModel)]="formData.modelo" placeholder="Corolla">
          </div>
        </div>
        <div class="field">
          <label class="field__label">Color</label>
          <input class="field__input" type="text" [(ngModel)]="formData.color" placeholder="Rojo">
        </div>
      </div>
      <div class="modal__foot">
        <button class="btn btn--ghost" (click)="closeForm()">Cancelar</button>
        <button class="btn btn--primary" (click)="createVehicle()">Crear vehículo</button>
      </div>
    </div>
  </div>

  <!-- Tabla -->
  <div class="table-wrap" *ngIf="vehicles$ | async as items">
    <div class="table">
      <div class="table__head">
        <div class="table__cell">Placa</div>
        <div class="table__cell">Marca</div>
        <div class="table__cell">Modelo</div>
        <div class="table__cell">Color</div>
        <div class="table__cell table__cell--right">Acciones</div>
      </div>

      <div class="table__body">
        <div class="table__row" *ngFor="let v of items">
          <ng-container *ngIf="editingId !== v.id_vehiculo; else editRow">
            <div class="table__cell"><code class="table__code">{{ v.placa }}</code></div>
            <div class="table__cell">{{ v.marca ?? '—' }}</div>
            <div class="table__cell">{{ v.modelo ?? '—' }}</div>
            <div class="table__cell">
              <span class="color-dot" [style.background]="v.color || '#e5e7eb'" [title]="v.color || 'Sin color'"></span>
              {{ v.color ?? '—' }}
            </div>
            <div class="table__cell table__cell--right">
              <div class="actions">
                <button class="action-btn" (click)="startEdit(v)" title="Editar">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                    <path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4Z"/>
                  </svg>
                </button>
                <button class="action-btn action-btn--danger" (click)="deleteVehicle(v.id_vehiculo, v.placa)" title="Eliminar">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                  </svg>
                </button>
              </div>
            </div>
          </ng-container>

          <ng-template #editRow>
            <div class="table__cell"><input class="inline-input" type="text" [(ngModel)]="editData.placa"></div>
            <div class="table__cell"><input class="inline-input" type="text" [(ngModel)]="editData.marca"></div>
            <div class="table__cell"><input class="inline-input" type="text" [(ngModel)]="editData.modelo"></div>
            <div class="table__cell"><input class="inline-input" type="text" [(ngModel)]="editData.color"></div>
            <div class="table__cell table__cell--right">
              <div class="actions">
                <button class="action-btn action-btn--success" (click)="saveEdit(v.id_vehiculo)" title="Guardar">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"/>
                  </svg>
                </button>
                <button class="action-btn" (click)="cancelEdit()" title="Cancelar">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                  </svg>
                </button>
              </div>
            </div>
          </ng-template>
        </div>

        <div class="table__empty" *ngIf="items.length === 0">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 17h14M5 17a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2M5 17a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2"/>
            <circle cx="7" cy="15" r="1.5"/><circle cx="17" cy="15" r="1.5"/>
          </svg>
          <p>No hay vehículos registrados</p>
        </div>
      </div>
    </div>
  </div>
</div>
