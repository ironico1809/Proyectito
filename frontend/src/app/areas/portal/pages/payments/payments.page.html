<div class="page">
  <header class="page__head">
    <div>
      <h1 class="page__title">Pagos</h1>
      <p class="page__sub">Historial de transacciones y comisiones</p>
    </div>
    <button class="page__btn" (click)="openForm()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      Registrar pago
    </button>
  </header>

  <!-- Modal crear pago -->
  <div class="modal-overlay" *ngIf="showForm" (click)="closeForm()">
    <div class="modal" (click)="$event.stopPropagation()">
      <div class="modal__head">
        <h3>Registrar pago</h3>
        <button class="modal__close" (click)="closeForm()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="modal__body">
        <div class="field">
          <label class="field__label">ID del incidente</label>
          <input class="field__input" type="number" min="1" [(ngModel)]="formData.incidente_id" placeholder="Ej. 1">
        </div>
        <div class="form-row">
          <div class="field">
            <label class="field__label">Monto total (Bs)</label>
            <input class="field__input" type="number" min="0" step="0.01" [(ngModel)]="formData.monto_total_decimal" placeholder="0.00">
          </div>
          <div class="field">
            <label class="field__label">Comisión (Bs)</label>
            <input class="field__input" type="number" min="0" step="0.01" [(ngModel)]="formData.comision_plataforma_decimal" placeholder="0.00">
          </div>
        </div>
        <div class="field">
          <label class="field__label">Método de pago</label>
          <select class="field__input" [(ngModel)]="formData.metodo_enum">
            <option value="qr">QR</option>
            <option value="efectivo">Efectivo</option>
            <option value="tarjeta">Tarjeta</option>
            <option value="transferencia">Transferencia</option>
          </select>
        </div>
      </div>
      <div class="modal__foot">
        <button class="btn btn--ghost" (click)="closeForm()">Cancelar</button>
        <button class="btn btn--primary" (click)="createPayment()">Registrar pago</button>
      </div>
    </div>
  </div>

  <div class="table-wrap" *ngIf="pagos$ | async as items">
    <div class="table">
      <div class="table__head">
        <div class="table__cell">ID</div>
        <div class="table__cell">Incidente</div>
        <div class="table__cell">Monto</div>
        <div class="table__cell">Comisión</div>
        <div class="table__cell">Método</div>
        <div class="table__cell">Estado</div>
      </div>

      <div class="table__body">
        <div class="table__row" *ngFor="let p of items">
          <div class="table__cell"><code class="table__code">#{{ p.id_pago }}</code></div>
          <div class="table__cell"><code class="table__code">#{{ p.incidente_id }}</code></div>
          <div class="table__cell table__cell--bold">{{ p.monto_total_decimal }} Bs</div>
          <div class="table__cell table__cell--muted">{{ p.comision_plataforma_decimal }} Bs</div>
          <div class="table__cell">
            <span class="badge-method">{{ p.metodo_enum }}</span>
          </div>
          <div class="table__cell">
            <span class="badge-status" [class.badge-status--ok]="p.estado_pago_enum === 'completado'">
              <span class="badge-status__dot"></span>
              {{ p.estado_pago_enum }}
            </span>
          </div>
        </div>

        <div class="table__empty" *ngIf="items.length === 0">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
          </svg>
          <p>Sin pagos para mostrar</p>
        </div>
      </div>
    </div>
  </div>
</div>
