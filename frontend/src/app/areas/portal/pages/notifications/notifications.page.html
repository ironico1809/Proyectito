<div class="page">
  <header class="page__head">
    <div>
      <h1 class="page__title">Notificaciones</h1>
      <p class="page__sub">Mantente al día con las novedades de tu taller</p>
    </div>
    <button class="page__btn" (click)="marcarTodasLeidas()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
      </svg>
      Marcar todas leídas
    </button>
  </header>

  <div class="notif-list" *ngIf="notifications$ | async as items">
    <button class="notif-card" *ngFor="let n of items"
      [class.notif-card--unread]="!n.leido_boolean"
      (click)="marcarLeida(n)">
      <div class="notif-card__dot" *ngIf="!n.leido_boolean"></div>
      <div class="notif-card__body">
        <div class="notif-card__title">{{ n.titulo }}</div>
        <div class="notif-card__msg">{{ n.mensaje }}</div>
        <div class="notif-card__date">{{ n.fecha_creacion_timestamp | date:'medium' }}</div>
      </div>
      <svg class="notif-card__check" *ngIf="!n.leido_boolean" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </button>

    <div class="table__empty" *ngIf="items.length === 0">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
      <p>No tienes notificaciones</p>
    </div>
  </div>
</div>
