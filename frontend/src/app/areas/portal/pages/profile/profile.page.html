<div class="page">
  <header class="page__head">
    <div>
      <h1 class="page__title">Mi Perfil</h1>
      <p class="page__sub">Administra tu información personal</p>
    </div>
  </header>

  <div class="profile-card" *ngIf="session$ | async as s">
    <div class="profile-hero">
      <div class="profile-avatar">{{ getUserInitial(s.displayName) }}</div>
      <div class="profile-hero__info">
        <h2 class="profile-hero__name">{{ s.displayName }}</h2>
        <span class="profile-hero__role">{{ s.role }}</span>
      </div>
    </div>

    <div class="profile-divider"></div>

    <div class="profile-section">
      <div class="profile-section__label">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
        </svg>
        Información personal
      </div>

      <div class="profile-form">
        <div class="field">
          <label class="field__label">Nombre completo</label>
          <input class="field__input" type="text" [(ngModel)]="usuario.nombre" placeholder="Tu nombre">
        </div>

        <div class="field">
          <label class="field__label">Correo electrónico</label>
          <input class="field__input field__input--disabled" type="email" [value]="s.userId ? '—' : ''" disabled placeholder="No disponible">
        </div>

        <div class="field">
          <label class="field__label">Teléfono</label>
          <input class="field__input" type="text" [(ngModel)]="usuario.telefono" placeholder="Ej. 78012345">
        </div>

        <div class="field">
          <label class="field__label">Rol</label>
          <input class="field__input field__input--disabled" type="text" [value]="s.role" disabled>
        </div>
      </div>
    </div>

    <div class="profile-divider"></div>

    <div class="profile-footer">
      <div class="toast" *ngIf="mostrarMensaje" [class.toast--success]="mensaje.includes('correctamente')" [class.toast--error]="mensaje.includes('Error')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        {{ mensaje }}
      </div>
      <button class="btn btn--primary" (click)="actualizar()" [disabled]="cargando">
        <svg *ngIf="cargando" class="btn__spinner" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <circle cx="12" cy="12" r="10" stroke-dasharray="31.4 31.4" stroke-linecap="round"/>
        </svg>
        <svg *ngIf="!cargando" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
          <polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>
        </svg>
        {{ cargando ? 'Guardando…' : 'Guardar cambios' }}
      </button>
    </div>
  </div>
</div>
