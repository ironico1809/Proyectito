<div class="perfil-container">
  <div class="perfil-welcome">
    <h1 class="titulo-perfil">Configuración de Perfil</h1>
    <p class="subtitulo-perfil">Actualiza tu información personal y de contacto.</p>
  </div>

  <div class="perfil-card">

    <!-- Header del perfil -->
    <div class="perfil-header">
      <div class="avatar-grande">{{ usuario.nombre[0] | uppercase }}</div>
      <div class="user-meta">
        <h2>{{ usuario.nombre }}</h2>
        <span class="badge-rol">{{ usuario.rol | uppercase }}</span>
      </div>
    </div>

    <div class="perfil-divider"></div>

    <!-- Sección: Información personal -->
    <div class="form-section">
      <div class="form-section-label">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
        </svg>
        Información personal
      </div>

      <div class="form-grid">
        <div class="input-group">
          <label class="form-label">Nombre Completo</label>
          <input class="form-input" type="text" [(ngModel)]="usuario.nombre" placeholder="Nombre completo">
        </div>
        <div class="input-group">
          <label class="form-label">
            Correo Electrónico
            <span class="label-badge">No editable</span>
          </label>
          <input class="form-input input-disabled" type="email" [value]="usuario.email" disabled>
        </div>
        <div class="input-group">
          <label class="form-label">Teléfono / Celular</label>
          <input class="form-input" type="text" [(ngModel)]="usuario.telefono" placeholder="Ej. 78012345">
        </div>
      </div>
    </div>

    <div class="perfil-divider"></div>

    <!-- Footer -->
    <div class="perfil-footer">
      <span class="msj-exito" *ngIf="mensaje">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        {{ mensaje }}
      </span>
      <button class="btn-guardar" (click)="actualizar()" [disabled]="cargando">
        <svg *ngIf="!cargando" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>
        </svg>
        {{ cargando ? 'Guardando...' : 'Guardar Cambios' }}
      </button>
    </div>

  </div>
</div>
