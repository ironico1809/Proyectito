<div class="container mt-4">
  <h2 class="mb-4 text-primary">Gestión de Cotizaciones (Paquete 1)</h2>
  <p class="text-muted">Incidentes en la red esperando asignación de taller.</p>
  
  <div class="row">
    <div class="col-md-6 mb-3" *ngFor="let inc of incidentesPendientes">
      <div class="card shadow-sm border-left-primary">
        <div class="card-body">
          <h5 class="card-title text-dark">Incidente #{{ inc.id_incidente }}</h5>
          <p class="card-text"><strong>Descripción:</strong> {{ inc.descripcion_texto || 'Sin descripción detallada' }}</p>
          <hr>
          
          <div class="mt-3">
            <label class="form-label">Propuesta Económica e Inversión de Tiempo</label>
            <input type="number" [(ngModel)]="nuevaCotizacion.precio_estimado" placeholder="Precio ($us)" class="form-control mb-2">
            <input type="number" [(ngModel)]="nuevaCotizacion.tiempo_estimado_min" placeholder="Tiempo estimado de llegada (Minutos)" class="form-control mb-2">
            <textarea [(ngModel)]="nuevaCotizacion.descripcion" placeholder="Detalles de la propuesta (Ej. Incluye grúa)" class="form-control mb-3"></textarea>
            
            <button class="btn btn-success w-100" (click)="enviarCotizacion(inc.id_incidente)">
              Enviar Propuesta
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="incidentesPendientes.length === 0" class="alert alert-info">
    No hay incidentes pendientes de cotización en este momento.
  </div>
</div>
