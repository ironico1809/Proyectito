<aside class="sidebar" [class.sidebar--open]="isSidebarOpen">
  <div class="sidebar__header">
    <div class="logo-icon">⚡</div>
    <span class="logo-text">Emergencias</span>
  </div>

  <nav class="sidebar__nav">
    <p class="nav-title">Principal</p>
    <a routerLink="/inicio" routerLinkActive="active" class="nav-link">
      <span class="icon">🏠</span> Dashboard
    </a>
    <a routerLink="/perfil" routerLinkActive="active" class="nav-link">
      <span class="icon">👤</span> Mi Perfil
    </a>
    
    <ng-container *ngIf="rolUsuario === 'admin'">
      <p class="nav-title">Paquete 1: Gestión</p>
      
      <a routerLink="/clientes" routerLinkActive="active" class="nav-link">
        <span class="icon">👥</span> Clientes
      </a>
      
      <a routerLink="/talleres" routerLinkActive="active" class="nav-link">
        <span class="icon">🔧</span> Talleres
      </a>

      <p class="nav-title">Paquete 5: Finanzas</p>
      <a routerLink="/comisiones" routerLinkActive="active" class="nav-link">
        <span class="icon">📊</span> Comisiones (CU14)
      </a>
    </ng-container>

    <ng-container *ngIf="rolUsuario === 'taller'">
      <p class="nav-title">Paquete 2: Operaciones</p>
      
      <a routerLink="/tecnicos" routerLinkActive="active" class="nav-link">
        <span class="icon">👨‍🔧</span> Staff Técnico
      </a>
      <a routerLink="/monitoreo" routerLinkActive="active" class="nav-link">
        <span class="icon">🛰️</span> Monitoreo Real
      </a>
      <a routerLink="/solicitudes" routerLinkActive="active" class="nav-link">
        <span class="icon">🚨</span> Emergencias Entrantes
      </a>

      <a routerLink="/mis-ingresos" routerLinkActive="active" class="nav-link">
        <span class="icon">💰</span> Mis Ingresos
      </a>
    </ng-container>
    <ng-container *ngIf="rolUsuario === 'tecnico'">
      <p class="nav-title">Mi Trabajo</p>
      
      <a routerLink="/historial-tecnico" routerLinkActive="active" class="nav-link">
        <span class="icon">📜</span> Historial de Auxilios
      </a>
    </ng-container>
  </nav>

  <div class="sidebar__footer">
    <button class="btn-logout" (click)="cerrarSesion()">
      <span class="icon">🚪</span> Cerrar Sesión
    </button>
  </div>
</aside>

<div 
  class="sidebar-overlay" 
  *ngIf="isSidebarOpen" 
  (click)="toggleSidebar()">
</div>
